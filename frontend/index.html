<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LFS X AI Signal XYZ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<header>
  <div>
    <h1>LFS X AI Signal XYZ</h1>
    <p>5-Minute Pattern Intelligence</p>
  </div>
  <span class="live">● READY</span>
</header>
<section class="markets" id="markets"></section>
<section class="panel">
  <div class="topline"><span id="symbol">USD/MXN OTC</span><span>TIMEFRAME: 5M</span></div>
  <div class="signal" id="signal">WAITING</div>
  <div class="prob">
    <div><b id="up">0%</b><small>UP</small></div>
    <div><b id="down">0%</b><small>DOWN</small></div>
  </div>
  <div class="meta">
    <span>Pattern: <b id="pattern">—</b></span>
    <span>Matches: <b id="matches">0</b></span>
  </div>
  <p class="note">Historical probability only. No result is guaranteed.</p>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
